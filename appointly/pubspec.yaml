name: appointly
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.6.1

dependencies:
  path: any
  flutter:
    sdk: flutter
  flutter_animated_splash: ^0.0.10
  flutter_native_splash: ^2.4.4

flutter_native_splash:
  android: true
  ios: true
  web: false
  color: "#ffffff"
  image: assets/image/main-logo.png
  branding: assets/image/baranding-logo.png
  android_12:
    color: "#ffffff"
    image: assets/image/main-logo.png

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: "^0.14.3"
  google_fonts: ^6.2.1
  flutter_svg_provider: ^1.0.7
  fl_chart: ^0.70.2
  image_input: ^0.0.5
  http: ^1.3.0
  provider: ^6.1.2
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7

flutter_launcher_icons:
  android: 'launcher_icon'
  ios: true
  image_path: 'assets/icons/logo-app-transparant.png'

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/image/
